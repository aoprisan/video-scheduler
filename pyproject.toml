[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "video-marketing"
version = "0.1.0"
description = "A durable local queue for YouTube uploads and scheduled publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
]

[project.scripts]
video-marketing = "video_marketing.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
